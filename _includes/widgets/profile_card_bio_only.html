<div class="mt-3 d-md-none"></div>
<div class="hero-block">
    <div class="hero-kicker">
        {% for position in site.data.profile.positions %}{{ position.name | downcase }}{% unless forloop.last %} · {% endunless %}{% endfor %}
    </div>
    <div class="hero-bio" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
        {{ site.data.profile.short_bio }}
    </div>
    {% if site.data.profile.cv_link %}
    <div class="mt-2">
        <a target="_blank" href="{{ site.data.profile.cv_link | relative_url }}"><i class="fas fa-file-alt"></i> Curriculum Vitae</a>
    </div>
    {% endif %}
</div>
