# 构建 Jekyll 站点并部署到 GitHub Pages（基于官方模板，按本仓库调整）
name: Deploy Jekyll site to Pages

on:
  # 推送到 main 时自动构建
  push:
    branches: ["main"]
  # 允许在 Actions 页手动触发
  workflow_dispatch:

# 部署 Pages 所需的 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；排队等待而不取消进行中的部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # CI 机器访问 gems.ruby-china.com 不稳定，统一镜像回 rubygems.org；
      # 仅写入 CI 工作目录的 .bundle/config，本地 Gemfile 不受影响
      - name: Configure bundler mirror for CI
        run: bundle config set --local mirror.https://gems.ruby-china.com/ https://rubygems.org

      - name: Install gems
        run: bundle install

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        # 默认输出到 ./_site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
